<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unsere kleine Welt ♡</title>

    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-heart">
                ♡
            </div>

            <p class="login-intro">
                Nur für uns...
            </p>

            <h1>
                Unsere kleine Welt
            </h1>

            <p class="login-text">
                Schön, dass du da bist.<br>
                Aber vorher brauche ich unser Geheimnis. ♡
            </p>

            <div class="login-form">

                <input
                    type="password"
                    id="PasswordInput"
                    placeholder="Unser Passwort..."
                    autocomplete="off"
                >

                <button id="LoginButton">
                    Eintreten ♡
                </button>

                <p id="LoginError"></p>

            </div>

        </div>

    </div>

</body>
</html>
