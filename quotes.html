<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zitate & Insider ♡</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="authGuard.js"></script>
    <script src="quotes.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2dfcf">
</head>

<body>

    <div class="quotes-container">

        <div class="quotes-header">
            <div class="quotes-heart">♡</div>
            <p>Nur wir verstehen das</p>
            <h1>Zitate & Insider</h1>
        </div>

        <!-- NEUES ZITAT -->
    <div class="quote-input">

        <textarea
            id="QuoteInput"
            placeholder="Was wurde gesagt? ♡"
        ></textarea>

        <input
            type="text"
            id="QuoteAuthor"
            placeholder="Wer hat es gesagt?"
        >

        <div class="visibility-toggle">
            <span class="visibility-toggle-text">Nur für Eltern sichtbar 🔒</span>
            <label class="switch">
                <input type="checkbox" id="ParentOnlyCheckbox">
                <span class="slider"></span>
            </label>
        </div>

        <button id="AddQuoteButton">
            Zitat hinzufügen ♡
        </button>

    </div>

        <!-- ZITATE -->
        <div id="QuotesList" class="quotes-board"></div>

        <button id="BackToAlbum" class="quotes-back">
            ← Zurück zu den Erinnerungen
        </button>

    </div>

</body>

</html>
